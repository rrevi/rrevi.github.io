<!-- Cloudflare Web Analytics -->
<script>
  if (window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1" && !window.location.hostname.endsWith(".local")) {
    var cfScript = document.createElement("script");
    cfScript.type = "module";
    cfScript.src = "https://static.cloudflareinsights.com/beacon.min.js";
    cfScript.setAttribute("data-cf-beacon", JSON.stringify({ token: "{{ site.cloudflare_analytics }}" }));
    document.head.appendChild(cfScript);
  }
</script>
<!-- End Cloudflare Web Analytics -->
