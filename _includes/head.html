<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ "/assets/css/syntax.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ "/assets/js/copy-code.js" | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.cloudflare_analytics -%}
    {%- include cloudflare-analytics.html -%}
    {%- endif -%}

    {%- include custom-head.html -%}
</head>
