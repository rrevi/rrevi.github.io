markdown: kramdown
highlighter: rouge
permalink: '/:title'
url: "https://rrevi.github.io"
lang: en
cloudflare_analytics: "1cfcb60a95bc4b198a888e65e7a36ba5"

kramdown:
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

title: Rants on Software Development
description: > # this means to ignore newlines until "show_excerpts:"
  Personal website and rants on software development from Rafael Revi.
author:
  name: Rafael Revi
  email: primers.flowing-0q@icloud.com
header_pages:
  - about.md
show_excerpts: false # set to true to show post excerpts on the homepage
show_intro: false # set to true to show post intro on the homepage

minima:
  skin: solarized
  social_links:
    github: rrevi
    linkedin: rafaelrevi
  date_format: "%Y-%m-%d" # http://shopify.github.io/liquid/filters/date/

remote_theme: jekyll/minima

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-remote-theme
